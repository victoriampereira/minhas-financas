<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="icons/wallet.png">
<link rel="apple-touch-icon" href="icons/wallet.png">
<meta name="theme-color" content="#f3f4f7">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f4f5f8; --line:#ebedf1; --text:#111318; --muted:#6b7280; --faint:#9ca3af;
  --blue:#2463eb; --blue2:#3b7bf6; --bluesoft:#eaf1ff; --navy:#1d3b8b; --green:#16a34a; --red:#e8345a; --amber:#b98900; --amberbg:#fdf3c4; --purple:#7c3aed;
  --border:1px solid #eceef2; --r:16px;
}
[data-theme=dark]{
  --bg:#0c0f15; --panel:#151a23; --panel2:#1c222d; --line:#242b38; --text:#eef1f6; --muted:#9aa3b2; --faint:#646d7d;
  --bluesoft:rgba(59,123,246,.16); --amberbg:rgba(217,170,0,.18); --amber:#e7c24a; --border:1px solid #1f2530;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
svg.i{width:18px;height:18px;flex-shrink:0;stroke-width:1.8}
.app{display:flex;gap:16px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));min-height:100vh;max-width:1560px;margin:0 auto}
/* sidebar */
.side{width:214px;flex-shrink:0;background:var(--panel);border:var(--border);border-radius:var(--r);padding:16px 10px 10px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--panel);flex-shrink:0}
.brand b{display:block;font-size:13px;font-weight:600}.brand small{color:var(--muted);font-size:11.5px}
.navlbl{font-size:11px;color:var(--muted);padding:10px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:500;margin-bottom:1px;font-size:13px}
.nav a svg{width:15px;height:15px;color:var(--muted)}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--panel2);font-weight:600}.nav a.on svg{color:var(--blue)}
.side .grow{flex:1}
.themebox{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;font-size:13px}
.themebox span{display:flex;gap:8px;align-items:center}.themebox svg{width:15px;height:15px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border-radius:999px;padding:3px;border:var(--border)}
.seg button{width:28px;height:24px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.seg button svg{width:13px;height:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 6px;border-top:1px solid var(--line)}
.me b{display:block;font-size:13px}.me small{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.me small:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{background:var(--panel);border:var(--border);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:4px}
.mbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text)}
.mbtn.dim{color:var(--faint)}
.mbtn:hover{background:var(--panel2)}
.month{font-size:25px;font-weight:600;letter-spacing:-.02em;padding:0 4px 0 8px;display:flex;align-items:center;gap:6px}
.month span{color:var(--muted);font-weight:500}.month svg{width:16px;height:16px;color:var(--muted)}
.top .grow{flex:1}
.bell{position:relative;width:36px;height:36px;border-radius:10px;border:var(--border);display:grid;place-items:center;margin-right:8px}
.bell .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--panel)}
.split{display:flex;border-radius:10px;overflow:hidden;background:var(--blue)}
.split button{color:#fff;font-weight:600;padding:9px 14px;display:flex;align-items:center;gap:6px}
.split button:hover{background:rgba(255,255,255,.1)}
.split .dd{border-left:1px solid rgba(255,255,255,.25);padding:9px 10px}
.split svg{width:15px;height:15px;stroke-width:2.4}
.btn{background:var(--blue);color:#fff;font-weight:600;border-radius:10px;padding:10px 16px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);color:var(--text);border:var(--border);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.danger{background:transparent;color:var(--red);border:var(--border)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn svg{width:15px;height:15px}
.rel{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:var(--border);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:6px;min-width:230px;z-index:30;display:none}
.menu.open{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
.menu button svg{width:16px;height:16px;color:var(--blue)}
.menu button:hover{background:var(--panel2)}
.menu .mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px}
.menu .mrow small{color:var(--muted);display:block}
/* overview layout */
.ovw{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.colL,.colR{display:flex;flex-direction:column;gap:16px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
.colR .card:last-child{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.card{background:var(--panel);border:var(--border);border-radius:var(--r);padding:22px 22px;position:relative;min-width:0;display:flex;flex-direction:column}
.ct{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.ct small{color:var(--muted);font-weight:400;font-size:12px}
.sub{color:var(--muted);font-size:12px}
.illu{position:absolute;right:20px;top:14px;width:auto;pointer-events:none;user-select:none}
.money{font-weight:700;letter-spacing:-.035em;line-height:1.05;white-space:nowrap}
.money .cur{color:var(--muted);font-weight:700;font-size:.62em;margin-right:.1em;letter-spacing:-.02em}
.money .cents{color:var(--muted);font-weight:500;font-size:.42em;letter-spacing:0}
.big{font-size:60px}.mid{font-size:34px}
.pos{color:var(--green)}.neg{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--amberbg);color:var(--amber)}
/* saldo */
.stack{display:flex;height:9px;gap:3px;margin:30px 0 12px}
.stack div{height:100%;min-width:0}
.stack div:first-child{border-radius:99px 0 0 99px}.stack div:last-child{border-radius:0 99px 99px 0}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.legend .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .k svg{width:12px;height:12px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.legend .v{font-weight:600;font-size:13.5px;margin-top:4px;line-height:1.35}
.legend .v small{white-space:nowrap}
.legend .v small{color:var(--faint);font-weight:400;font-size:11px}
.legend .sob .k,.legend .sob .v{color:var(--green)}.legend .sob .k b{color:var(--text)}
/* contas a pagar */
.chips{display:flex;gap:8px;margin:18px 0 6px}
.chip{flex:1;min-width:0;border:var(--border);border-radius:10px;padding:9px 2px 7px;text-align:center;font-weight:600;font-size:14px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chip i{display:block;font-style:normal;color:var(--faint);font-size:8px;letter-spacing:1.5px;line-height:1;height:8px}
.chip.next{background:var(--blue);color:#fff;border-color:var(--blue)}.chip.next i{color:#fff}
.chip.sel{outline:2px solid var(--blue);outline-offset:1px}
.chip.done{opacity:.4}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}
.row .vl{font-weight:600;white-space:nowrap}
.chk{width:19px;height:19px;border-radius:50%;border:1.5px solid #c9ced8;flex-shrink:0;display:grid;place-items:center;color:#fff;background:var(--panel)}
.chk svg{width:12px;height:12px;stroke-width:3}
.chk.on{background:var(--green);border-color:var(--green)}
.row.paid .nm,.row.paid .vl{color:var(--faint);text-decoration:line-through}
.fade{position:relative;flex:1;min-height:120px}
.fade .scroll{position:absolute;inset:0;overflow:auto;padding-bottom:24px}
.fade:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--panel));pointer-events:none}
.ico{width:34px;height:34px;border-radius:9px;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.ico svg{width:16px;height:16px}
.clickrow{cursor:pointer}.clickrow:hover .nm{color:var(--blue)}
/* categorias */
.split2{display:flex;justify-content:space-between;margin-top:22px;font-size:11.5px;color:var(--muted)}
.split2 b{display:block;color:var(--text);font-size:14px;margin-top:3px;font-weight:600}
.catbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-top:8px;gap:2px}
.catbar div{display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.catbar div:last-child{justify-content:flex-end}
.h4{font-weight:600;font-size:12px;margin:24px 0 2px}
.drow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .nm{flex:1;font-weight:500}.drow .vl{font-weight:600}
.cfoot{margin:auto -22px -22px;padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px}
.cfoot .grow{flex:1}
/* cartões */
.cbtns{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.circ{width:28px;height:28px;border-radius:50%;border:var(--border);display:grid;place-items:center;background:var(--panel)}
.circ svg{width:14px;height:14px}.circ.dim{color:var(--faint)}
.ccwrap{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:20px -22px 0 0;padding:0 22px 0 0;scrollbar-width:none}
.ccwrap::-webkit-scrollbar{display:none}
.cc{scroll-snap-align:start;flex:0 0 90%;aspect-ratio:1.6;border-radius:12px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.cc:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(255,255,255,.12),transparent 45%);pointer-events:none}
.cc .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
.cc .tag{font-size:10px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;font-weight:600}
.cc .mid{display:flex;justify-content:space-between;align-items:center;font-size:inherit}
.cc .nmc{letter-spacing:.38em;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.92}
.cc .b{display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;letter-spacing:.06em;opacity:.75}
.cc .b b{display:block;font-size:13px;margin-top:3px;letter-spacing:0;opacity:1;color:#fff}
.cc .b div{opacity:1}
.cc svg.nfc{width:20px;height:20px;opacity:.85}
.fl{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-top:26px}
.fats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;height:168px}
.fat{border-radius:10px;background:var(--panel2);padding:12px 6px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.fat.on{border:1.5px solid var(--blue);background:var(--panel)}
.fat .m{font-size:12px;font-weight:600;position:relative;z-index:2}
.fat .tg{font-size:9.5px;color:var(--blue);background:var(--bluesoft);border-radius:99px;padding:1px 7px;font-weight:600;margin-top:4px;display:inline-block}
.fat .v{font-size:12.5px;font-weight:500;color:var(--muted);position:relative;z-index:2}
.fat.on .v{color:var(--blue);font-weight:600}
.fats svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pt{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);transform:translate(-50%,-50%);pointer-events:none}
.pt.on{border-color:var(--blue)}
/* moradia */
.tog{display:flex;background:var(--panel2);border-radius:9px;padding:3px;margin-top:22px}
.tog button{flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted)}
.tog button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.track{position:relative;height:18px;background:var(--panel2);border-radius:5px;margin:34px 0 8px}
.track .fill{height:100%;border-radius:5px;background:var(--green)}
.track .mark{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--text);border-radius:2px}
.track .mark span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-weight:600}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.mitems{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:12px}
.mitem{display:flex;gap:10px;align-items:center;min-width:0}
.mitem small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem b{font-size:13px;font-weight:600}
/* reserva */
.resv{display:flex;align-items:center;gap:20px}
.resv .grow{flex:1;min-width:0}
/* pages */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.pagehead h2{font-size:17px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:10px}
.tabs button{padding:6px 12px;border-radius:8px;font-weight:500;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.daygrp{font-size:11.5px;color:var(--muted);font-weight:600;margin:16px 0 0;text-transform:capitalize}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.kpi{background:var(--panel2);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--muted);font-size:11.5px}.kpi b{display:block;font-size:16px;margin-top:3px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.step{background:var(--panel2);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;border:1.5px solid transparent}
.step:hover{border-color:var(--blue)}
.step b{font-size:13px}.step small{color:var(--muted);font-size:11.5px}
.step.done{opacity:.5}
.banner{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:500}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.open{display:flex}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{font-size:16px;margin-bottom:14px;font-weight:600}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:5px}
.f input,.f select{width:100%;padding:11px 12px;border-radius:10px;border:var(--border);background:var(--panel2);font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus{border-color:var(--blue)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mact .grow{flex:1}
.typesw{display:flex;gap:6px;margin-bottom:14px}
.typesw button{flex:1;padding:9px;border-radius:9px;background:var(--panel2);font-weight:600;font-size:13px}
.typesw button.on.g{background:rgba(232,52,90,.12);color:var(--red)}
.typesw button.on.r{background:rgba(22,163,74,.12);color:var(--green)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.modal.wide{max-width:780px}
.ihead,.irow{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.3fr) 104px 104px 28px;gap:6px;align-items:center}
.ihead{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px}
.irow{margin-bottom:6px}
.irow input,.irow select{width:100%;padding:9px 10px;border-radius:9px;border:var(--border);background:var(--panel2);font-size:14px;outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.irow input:focus{border-color:var(--blue)}
.ipar{display:flex;align-items:center;gap:4px}.ipar input{text-align:center;padding:9px 4px}.ipar span{font-size:11px;color:var(--muted)}
details summary::-webkit-details-marker{display:none}

.ccsolo .cc{flex:none;width:100%}
.cc.art{background-size:cover;background-position:center;justify-content:flex-end;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.cc.art:after{display:none}
.cc.art .ab{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:62%}
.cc.art .tag{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600}
.cc.art .b2{display:flex;gap:16px;font-size:9px;letter-spacing:.06em;opacity:.95}
.cc.art .b2 b{display:block;font-size:13px;margin-top:2px;letter-spacing:0}
.cc.art{text-shadow:0 1px 2px rgba(0,0,0,.25)}
.cc.art.light{color:#14213d;text-shadow:none}.cc.art.light .tag{background:rgba(20,33,61,.12)}
.cc .tag.closed{background:rgba(255,255,255,.35)}
.models{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.models button{aspect-ratio:1.6;border-radius:8px;background-size:cover;background-position:center;border:3px solid transparent}
.models button.on{border-color:var(--blue)}
#prev b{display:inline;font-size:inherit;margin:0}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:500;font-size:13px;z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.bottomnav{display:none}
@media (max-width:1240px){
  .ovw{grid-template-columns:minmax(0,1fr)}
  .colL,.colR{display:contents}
  .ovw>.colL>.card{order:1}.ovw>.colR>.card{order:2}.row2{order:3}

const _hol={};
function feriados(y){if(_hol[y])return _hol[y];const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const P=new Date(y,mo-1,da);const add=n=>{const x=new Date(P);x.setDate(x.getDate()+n);return (x.getMonth()+1)+'-'+x.getDate()};
  const s=new Set(['1-1','4-21','5-1','9-7','10-12','11-2','11-15','11-20','12-25',add(-48),add(-47),add(-2),add(60)]);return _hol[y]=s}
function diaUtil1(mk){const y=Math.floor(mk/12),m=mk%12;for(let d=1;d<=10;d++){const w=new Date(y,m,d).getDay();if(w!==0&&w!==6&&!feriados(y).has((m+1)+'-'+d))return d}return 1}
function dueDay(card,mk){return card.vencTipo==='fixo'?Number(card.vencimento||1):diaUtil1(mk)}
function fixaAtiva(f,mk){if(f.inicio&&dateMk(f.inicio+'-01')>mk)return false;if(f.fim&&dateMk(f.fim+'-01')<mk)return false;return true}

function compute(mk){
  const C=S.config;
  const rendaPadrao=C.rendas.reduce((a,r)=>a+Number(r.valor||0),0);
  const ovr=(C.rendaMes||{})[mkStr(mk)];const rendaReal=ovr!=null;
  const rendaFixa=rendaReal?Number(ovr):rendaPadrao;
  const receitas=S.lanc.filter(l=>l.tipo==='receita'&&dateMk(l.data)===mk);
  const renda=rendaFixa+receitas.reduce((a,l)=>a+Number(l.valor),0);
  const fixas=C.fixas.filter(f=>fixaAtiva(f,mk));
  const fixasConta=fixas.filter(f=>f.pagamento==='conta');
  const cards={};C.cartoes.forEach(c=>cards[c.id]={card:c,items:[],total:0});
  fixas.filter(f=>f.pagamento!=='conta'&&cards[f.pagamento]).forEach(f=>cards[f.pagamento].items.push({nome:f.nome,valor:Number(f.valor),categoria:f.categoria,fixa:true}));
  S.lanc.filter(l=>l.tipo==='despesa'&&l.pagamento!=='conta'&&cards[l.pagamento]).forEach(l=>{
    const card=cards[l.pagamento].card;const n=Math.max(1,Number(l.parcelas||1));const first=firstFat(l,card);const i=mk-first;
    if(i>=0&&i<n)cards[l.pagamento].items.push({nome:l.descricao,valor:r2(Number(l.valor)/n),categoria:l.categoria,parc:n>1?`${i+1}/${n}`:'',data:l.data,lanc:l});
  });
  Object.values(cards).forEach(c=>c.total=r2(c.items.reduce((a,x)=>a+x.valor,0)));
  const avulsas=S.lanc.filter(l=>l.tipo==='despesa'&&(l.pagamento==='conta'||!cards[l.pagamento])&&dateMk(l.data)===mk);
  const isRes=x=>x.categoria==='Reserva';
  const fixasTot=fixasConta.filter(f=>!isRes(f)).reduce((a,f)=>a+Number(f.valor),0);
  const reservaTot=fixasConta.filter(isRes).reduce((a,f)=>a+Number(f.valor),0)+avulsas.filter(isRes).reduce((a,l)=>a+Number(l.valor),0);
  const avulsasTot=avulsas.filter(l=>!isRes(l)).reduce((a,l)=>a+Number(l.valor),0);
  const cartoesTot=Object.values(cards).reduce((a,c)=>a+c.total,0);
  const sobra=r2(renda-fixasTot-cartoesTot-reservaTot);
  // categorias
  const cat={};const addC=(k,v)=>{cat[k]=(cat[k]||0)+v};
  fixasConta.forEach(f=>addC(f.categoria||'Outros',Number(f.valor)));
  avulsas.forEach(l=>addC(l.categoria||'Outros',Number(l.valor)));
  Object.values(cards).forEach(c=>c.items.forEach(x=>addC(x.categoria||'Outros',x.valor)));
  // moradia
  const moradia=[];
  fixasConta.filter(f=>f.categoria==='Moradia').forEach(f=>moradia.push({nome:f.nome,valor:Number(f.valor)}));
  avulsas.filter(l=>l.categoria==='Moradia').forEach(l=>moradia.push({nome:l.descricao,valor:Number(l.valor)}));
  Object.values(cards).forEach(c=>c.items.filter(x=>x.categoria==='Moradia').forEach(x=>moradia.push({nome:x.nome,valor:x.valor})));
  // contas a pagar
  const pagar=fixasConta.map(f=>({id:'f:'+f.id,nome:f.nome,valor:Number(f.valor),dia:Number(f.dia||1),categoria:f.categoria}));
  Object.values(cards).filter(c=>c.total>0).forEach(c=>pagar.push({id:'c:'+c.card.id,nome:'Fatura '+c.card.nome,valor:c.total,dia:dueDay(c.card,mk),categoria:'cartao'}));
  pagar.sort((a,b)=>a.dia-b.dia||a.nome.localeCompare(b.nome));
  const pagas=S.pagas[mkStr(mk)]||{};pagar.forEach(p=>p.paga=!!pagas[p.id]);
  return {renda,rendaFixa,rendaPadrao,rendaReal,receitas,fixas,fixasConta,cards,avulsas,fixasTot,reservaTot,avulsasTot,cartoesTot,sobra,cat,moradia,pagar,
    moradiaTot:r2(moradia.reduce((a,x)=>a+x.valor,0))};
}
function reservaSaldo(mk){
  const R=S.config.reserva||{};let s=Number(R.saldo||0);const base=R.base!=null?R.base:TODAY_MK;
  for(let m=base+1;m<=mk&&m<=base+240;m++)s+=compute(m).reservaTot;
  return r2(s);
}

      <svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b7bf6" stop-opacity=".28"/><stop offset="1" stop-color="#3b7bf6" stop-opacity=".02"/></linearGradient></defs>

}
function limiteLivre(card){
  if(!Number(card.limite))return null;let usado=0;

  return r2(Number(card.limite)-usado);
}

const pagOpts=sel=>`<option value="conta" ${sel==='conta'?'selected':''}>Débito / Pix / boleto</option>`+S.config.cartoes.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>Cartão ${esc(c.nome)}</option>`).join('');
function openModal(html){$('#modal').classList.remove('wide');$('#modal').innerHTML=html;$('#ov').classList.add('open');setTimeout(()=>{const i=$('#modal input:not([type=date])');if(i&&window.innerWidth>860)i.focus()},50)}
function closeModal(){$('#ov').classList.remove('open')}

const GUESS=[[/mercad|super|zaffari|carrefour|atacad|asun|nacional|bistek|hortifruti|padaria|açougue|acougue/i,'Mercado'],[/ifood|restaur|lanch|pizz|burger|bar |cafe|café|starbucks|mc ?donald|bk |outback|sushi|rappi/i,'Restaurantes'],[/uber|99|posto|shell|ipiranga|combust|gasolina|estacion|pedágio|pedagio|sem parar|veloe|cabify/i,'Transporte'],[/farm|drog|panvel|raia|sao joao|são joão|médic|medic|clinic|laborat|dent|unimed|saúde|saude/i,'Saúde'],[/netflix|spotify|prime|disney|hbo|max|youtube|apple\.com|icloud|google|globoplay|deezer|assinat/i,'Assinaturas'],[/amazon|mercado ?livre|mercadolivre|shopee|shein|magalu|magazine|renner|riachuelo|c&a|zara|americanas|aliexpress|loja/i,'Compras'],[/cinema|ingresso|show|teatro|parque|steam|playstation|xbox/i,'Lazer'],[/escola|curso|faculdade|udemy|livro|livraria|alura/i,'Educação'],[/pet|ração|racao|veterin|cobasi|petz/i,'Pets'],[/hotel|airbnb|booking|latam|gol |azul|passagem|decolar|viagem/i,'Viagem'],[/aluguel|condom|luz|energia|ceee|água|agua|internet|vivo|claro|tim |oi /i,'Contas e serviços']];
function guessCat(d){for(const[r,c]of GUESS)if(r.test(d))return c;return null}
function lastPag(){let v=null;try{v=localStorage.getItem('fin-lastpag')}catch(e){}if(v&&(v==='conta'||cardById(v)))return v;return S.config.cartoes[0]?S.config.cartoes[0].id:'conta'}
const fatLbl=(card,mk)=>`${MESES[mk%12]}${Math.floor(mk/12)!==Math.floor(TODAY_MK/12)?' '+Math.floor(mk/12):''} (vence ${dd(dueDay(card,mk))}/${dd(mk%12+1)})`;

function formLanc(l,tipo,cardPre){
  const ed=!!(l&&l.id);l=l||{tipo:tipo||'despesa',descricao:'',valor:'',data:defaultDate(),categoria:tipo==='receita'?'Salário':'Outros',pagamento:cardPre||lastPag(),parcelas:1};
  const rec=l.tipo==='receita';let catTouched=ed;let modo='total';
  let atual=1;let fatPick=null;if(ed&&cardById(l.pagamento))fatPick=firstFat(l,cardById(l.pagamento));let lastCard=l.pagamento;
  openModal(`<h3>${ed?'Editar lançamento':rec?'Nova receita':'Novo gasto'}</h3>
  <div class="typesw"><button class="g ${!rec?'on':''}" data-tsw="despesa">Gasto</button><button class="r ${rec?'on':''}" data-tsw="receita">Receita</button></div>
  <form id="fm">
    <div class="f"><label style="display:flex;justify-content:space-between;align-items:center">Valor<span class="tabs" id="vmode" style="padding:2px;display:none"><button type="button" class="on" data-vm="total" style="padding:3px 9px;font-size:11.5px">total</button><button type="button" data-vm="parc" style="padding:3px 9px;font-size:11.5px">cada parcela</button></span></label><input name="valor" inputmode="decimal" required placeholder="0,00" value="${numIn(l.valor)}" style="font-size:22px;font-weight:700"></div>
    <div class="f"><label>Descrição</label><input name="descricao" required placeholder="${rec?'Ex.: 13º, venda, reembolso':'Ex.: Mercado Zaffari'}" value="${esc(l.descricao)}" autocomplete="off"></div>
    ${rec?'':`<div class="f2"><div class="f"><label>Pagamento</label><select name="pagamento" id="pagSel">${pagOpts(l.pagamento)}</select></div>
    <div class="f" id="parcBox"><label>Parcelas</label><select name="parcelas" id="parcSel">${Array.from({length:24},(_,i)=>`<option ${Number(l.parcelas)===i+1?'selected':''} value="${i+1}">${i===0?'À vista':(i+1)+'x'}</option>`).join('')}</select></div></div>
    <div class="f2" id="fatRow"><div class="f"><label>Fatura</label><select name="fat" id="fatSel"></select></div>
    <div class="f" id="atualBox"><label>Parcela nessa fatura</label><select name="atual" id="atualSel"></select></div></div>`}
    <div class="f2"><div class="f"><label>Data da compra</label><input type="date" name="data" required value="${l.data}"></div>
    <div class="f"><label>Categoria</label><select name="categoria" id="catSel">${catOpts(l.categoria,rec?[]:['Salário'])}</select></div></div>
    ${rec?'':'<div class="kpi" id="prev" style="font-size:12.5px;line-height:1.5"></div>'}
    <div class="mact">${ed?`<button type="button" class="btn danger" id="delL">Excluir</button>`:''}<div class="grow"></div><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div>
  </form>`);
  const fm=$('#fm');
  $('#modal').querySelectorAll('[data-tsw]').forEach(b=>b.onclick=()=>{if(b.dataset.tsw===l.tipo)return;const fd=new FormData(fm);formLanc({...l,tipo:b.dataset.tsw,valor:parseNum(fd.get('valor')),descricao:fd.get('descricao'),data:fd.get('data'),categoria:b.dataset.tsw==='receita'?'Salário':'Outros',pagamento:l.pagamento||lastPag(),parcelas:l.parcelas||1})});
  const cs=$('#catSel');cs.onchange=()=>catTouched=true;
  fm.descricao.addEventListener('input',()=>{if(catTouched||rec)return;const g=guessCat(fm.descricao.value);cs.value=g||'Outros';upd()});
  function vals(){const card=rec?null:cardById(fm.pagamento.value);const n=card?Number(fm.parcelas.value):1;const raw=parseNum(fm.valor.value);const total=modo==='parc'&&n>1?raw*n:raw;const at=card&&n>1?Number(fm.atual.value||1):1;const fat=card?Number(fm.fat.value||openFat(card)):null;return{card,n,total,at,fat}}
  function upd(){
    if(rec)return;const {card,n,total,at}=vals();
    $('#parcBox').style.opacity=card?1:.4;fm.parcelas.disabled=!card;
    $('#vmode').style.display=card&&n>1?'inline-flex':'none';
    $('#fatRow').style.display=card?'grid':'none';
    if(card){const of=openFat(card);if(card.id!==lastCard){fatPick=null;lastCard=card.id}const cur=fm.fat.value&&fm.fat.dataset.card===card.id?Number(fm.fat.value):(fatPick??of);
      fm.fat.dataset.card=card.id;fm.fat.innerHTML=Array.from({length:7},(_,i)=>of-3+i).map(m=>`<option value="${m}" ${m===cur?'selected':''}>${MESES[m%12]}${Math.floor(m/12)!==Math.floor(TODAY_MK/12)?' '+Math.floor(m/12):''} · ${fatStatus(card,m).toLowerCase()}</option>`).join('')}
    $('#atualBox').style.visibility=card&&n>1?'visible':'hidden';
    if(card&&n>1){const prev=Number(fm.atual.value||atual);fm.atual.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(prev,n)?'selected':''}>${i===0?'1ª (compra nova)':`${i+1}ª de ${n}`}</option>`).join('')}
    let h='';const v=vals();
    if(!card)h=`Sai da conta em <b>${new Date(fm.data.value+'T12:00').toLocaleDateString('pt-BR')}</b> · ${fmt(total)}`;
    else{const first=v.fat-(v.at-1);const last=first+n-1;
      h=`${n>1?`<b>${n}x de ${fmt(total/n)}</b> · total ${fmt(total)}<br>`:''}${n>1?(v.at>1?`Parcela ${v.at}/${n} na fatura de <b>${fatLbl(card,v.fat)}</b>`:'1ª parcela na fatura de <b>'+fatLbl(card,first)+'</b>'):'Entra na fatura de <b>'+fatLbl(card,first)+'</b>'}${n>1?`<br>Última parcela: <b>${MESES[last%12].toLowerCase()} ${Math.floor(last/12)}</b>`:''}${fatStatus(card,v.fat)==='Fechada'?'<br><span style="color:var(--amber)">Atenção: essa fatura já está fechada.</span>':''}`}
    $('#prev').innerHTML=h;
  }
  if(!rec){$('#vmode').querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{modo=b.dataset.vm;$('#vmode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));upd()});
    fm.addEventListener('input',upd);fm.addEventListener('change',upd);upd()}
  fm.onsubmit=e=>{e.preventDefault();const fd=new FormData(fm);if(parseNum(fd.get('valor'))<=0){toast('Informe um valor');return}
    const t=$('#modal .typesw .on').dataset.tsw;
    const nl={id:l.id||uidGen(),criado:l.criado||Date.now(),tipo:t,descricao:String(fd.get('descricao')).trim(),data:fd.get('data'),categoria:fd.get('categoria')};
    if(t==='despesa'){const {card,n,total,at,fat}=vals();nl.valor=r2(total);nl.pagamento=card?card.id:'conta';nl.parcelas=n;if(card)nl.fat0=mkStr(fat-(at-1));try{localStorage.setItem('fin-lastpag',nl.pagamento)}catch(e){}}
    else nl.valor=r2(parseNum(fd.get('valor')));
    saveLanc(nl);closeModal();toast(ed?'Lançamento atualizado':'Lançado ✓')};
  const dl=$('#delL');if(dl)dl.onclick=()=>confirmDel('este lançamento',()=>{delLanc(l.id);toast('Excluído')});
}

/* ---- importar fatura em lote ---- */
function parseFatura(txt,fatMk){
  const rows=[];
  txt.split(/\n/).forEach(line=>{
    let s=line.replace(/\t/g,' ').trim();if(!s)return;
    const vm=[...s.matchAll(/-?\s?(?:R\$\s*)?(\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2})/g)];if(!vm.length)return;
    const last=vm[vm.length-1];let v=parseNum(last[1]);if(/-\s?(R\$\s*)?$/.test(s.slice(0,last.index+1))||/^-/.test(last[0]))return;
    s=(s.slice(0,last.index)+s.slice(last.index+last[0].length)).trim();
    if(/pagamento|estorno|crédito|credito|anuidade dif|saldo anterior|total/i.test(s)&&!/parc/i.test(s))return;
    let data=null;const dm=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+/);
    if(dm){const d=Number(dm[1]),m=Number(dm[2]);let y=dm[3]?Number(dm[3].length===2?'20'+dm[3]:dm[3]):Math.floor(fatMk/12);if(!dm[3]&&y*12+m-1>fatMk)y--;if(d>=1&&d<=31&&m>=1&&m<=12)data=y+'-'+dd(m)+'-'+dd(d);s=s.slice(dm[0].length)}
    let at=1,tot=1;const pm=s.match(/(?:parc(?:ela)?\.?\s*)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})(?!\d)/i);
    if(pm){const a=Number(pm[1]),b=Number(pm[2]);if(b>=2&&a>=1&&a<=b){at=a;tot=b;s=(s.slice(0,pm.index)+s.slice(pm.index+pm[0].length))}}
    s=s.replace(/R\$/g,'').replace(/\s{2,}/g,' ').replace(/[-–·|]+\s*$/,'').trim();
    rows.push({desc:s||'Compra',cat:guessCat(s)||'Outros',valor:v,at,tot,data});
  });
  return rows;
}
function formImport(cardId){
  const cards=S.config.cartoes;if(!cards.length){toast('Cadastre um cartão primeiro');formCartao();return}
  let card=cardById(cardId)||cardById(lastPag())||cards[0];let fat=openFat(card);
  let rows=[{desc:'',cat:'Outros',valor:'',at:1,tot:1}];
  openModal(`<h3>Lançar fatura do cartão</h3>
  <div class="sub" style="margin:-6px 0 14px">Copie as compras da fatura (no app do banco) e lance tudo de uma vez. Para parceladas, informe o valor <b>da parcela</b> e qual parcela é (ex.: 3 de 10). As próximas já entram nas faturas seguintes.</div>
  <div class="f2"><div class="f"><label>Cartão</label><select id="impCard">${cards.map(c=>`<option value="${c.id}" ${c.id===card.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
  <div class="f"><label>Fatura de</label><select id="impFat"></select></div></div>
  <div id="impWarn"></div>
  <details style="margin:4px 0 12px"><summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--blue)">Colar texto da fatura (opcional)</summary>
    <div class="f" style="margin-top:8px"><textarea id="impTxt" rows="5" placeholder="Ex.:&#10;12/10 MERCADO ZAFFARI 245,90&#10;03/08 NOTEBOOK DELL PARC 04/10 480,00&#10;NETFLIX 55,90" style="width:100%;padding:10px 12px;border-radius:10px;border:var(--border);background:var(--panel2);font:inherit;font-size:14px;color:var(--text);resize:vertical"></textarea></div>
    <button type="button" class="btn sm" id="impParse">${ic('check')}Ler texto</button><span class="hint" style="margin-left:8px">Confira as linhas abaixo antes de salvar.</span></details>
  <div class="ihead"><span>Descrição</span><span>Categoria</span><span>Valor (parcela)</span><span>Parcela</span><span></span></div>
  <div id="impRows"></div>
  <button type="button" class="btn ghost sm" id="impAdd" style="margin-top:4px">${ic('plus')}Linha</button>
  <div class="kpi" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><small>Total desta fatura (o que você lançou)</small><b id="impTot">R$ 0,00</b></div>
  <div class="mact"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" id="impSave">Salvar tudo</button></div>`);
  $('#modal').classList.add('wide');
  const fillFat=()=>{const of=openFat(card);$('#impFat').innerHTML=Array.from({length:9},(_,i)=>of-6+i).map(m=>`<option value="${m}" ${m===fat?'selected':''}>${fatLbl(card,m)} · ${fatStatus(card,m).toLowerCase()}</option>`).join('');warn()};
  const warn=()=>{const n=(compute(fat).cards[card.id]?.items||[]).filter(x=>x.lanc).length;$('#impWarn').innerHTML=n?`<div class="banner" style="margin-bottom:12px">Já existem ${n} compra(s) lançada(s) nessa fatura deste cartão. Cuidado para não lançar em dobro.</div>`:''};
  const sync=()=>{document.querySelectorAll('#impRows .irow').forEach((el,i)=>{const r=rows[i];r.desc=el.querySelector('[data-k=desc]').value;r.cat=el.querySelector('[data-k=cat]').value;r.valor=el.querySelector('[data-k=valor]').value;r.at=Number(el.querySelector('[data-k=at]').value)||1;r.tot=Number(el.querySelector('[data-k=tot]').value)||1})};
  const total=()=>{sync();$('#impTot').textContent=fmt(rows.reduce((a,r)=>a+parseNum(r.valor),0))};
  const draw=()=>{$('#impRows').innerHTML=rows.map((r,i)=>`<div class="irow">
    <input data-k="desc" placeholder="Ex.: Notebook" value="${esc(r.desc)}">
    <select data-k="cat">${catOpts(r.cat,['Salário'])}</select>
    <input data-k="valor" inputmode="decimal" placeholder="0,00" value="${typeof r.valor==='number'?numIn(r.valor):esc(r.valor)}">
    <div class="ipar"><input data-k="at" inputmode="numeric" value="${r.at}"><span>de</span><input data-k="tot" inputmode="numeric" value="${r.tot}"></div>
    <button type="button" class="circ" data-delrow="${i}" aria-label="Remover linha">${ic('x')}</button></div>`).join('');total()};
  $('#impRows').addEventListener('input',e=>{total();if(e.target.dataset.k==='desc'){const i=[...document.querySelectorAll('#impRows .irow')].indexOf(e.target.closest('.irow'));const g=guessCat(e.target.value);if(g&&!rows[i]._catTouched){rows[i].cat=g;e.target.closest('.irow').querySelector('[data-k=cat]').value=g}}});
  $('#impRows').addEventListener('change',e=>{if(e.target.dataset.k==='cat'){const i=[...document.querySelectorAll('#impRows .irow')].indexOf(e.target.closest('.irow'));rows[i]._catTouched=true}sync()});
  $('#impRows').addEventListener('click',e=>{const b=e.target.closest('[data-delrow]');if(!b)return;sync();rows.splice(Number(b.dataset.delrow),1);if(!rows.length)rows.push({desc:'',cat:'Outros',valor:'',at:1,tot:1});draw()});
  $('#impAdd').onclick=()=>{sync();rows.push({desc:'',cat:'Outros',valor:'',at:1,tot:1});draw();const ins=document.querySelectorAll('#impRows [data-k=desc]');ins[ins.length-1].focus()};
  $('#impCard').onchange=e=>{card=cardById(e.target.value);fat=openFat(card);fillFat()};
  $('#impFat').onchange=e=>{fat=Number(e.target.value);warn()};
  $('#impParse').onclick=()=>{const p=parseFatura($('#impTxt').value,fat);if(!p.length){toast('Não encontrei valores no texto');return}sync();rows=rows.filter(r=>r.desc||parseNum(r.valor)).concat(p);draw();$('#impTxt').value='';toast(p.length+' linha(s) lida(s) — confira')};
  $('#impSave').onclick=async()=>{sync();
    const ok=rows.filter(r=>parseNum(r.valor)>0);if(!ok.length){toast('Nenhuma linha com valor');return}
    const bad=ok.find(r=>r.at<1||r.tot<1||r.at>r.tot||r.tot>48);if(bad){toast('Confira a parcela de "'+(bad.desc||'linha')+'"');return}
    const fech=Number(card.fechamento||1);const t0=Date.now();
    for(const [i,r] of ok.entries()){
      const f0=fat-(r.at-1);const closeMk=vencNum(card)<=fech?f0-1:f0;
      const data=r.data||(mkStr(closeMk)+'-'+dd(Math.max(1,Math.min(28,fech-1))));
      saveLanc({id:uidGen(),criado:t0+i,tipo:'despesa',descricao:(r.desc||'Compra').trim(),valor:r2(parseNum(r.valor)*r.tot),data,categoria:r.cat,pagamento:card.id,parcelas:r.tot,fat0:mkStr(f0)});
    }
    try{localStorage.setItem('fin-lastpag',card.id)}catch(e){}
    closeModal();toast(ok.length+' compra(s) lançada(s) ✓');
  };
  fillFat();draw();
}

  <div class="f2"><div class="f"><label>Fatura aberta agora</label><select name="aberta">${Array.from({length:5},(_,i)=>of-2+i).map(m=>`<option value="${mkStr(m)}" ${m===of?'selected':''}>${MESES[m%12]} ${Math.floor(m/12)}</option>`).join('')}</select></div>
  <div class="f"><label>Limite (opcional)</label><input name="limite" inputmode="decimal" placeholder="0,00" value="${numIn(c.limite)}"></div></div>
  <div class="f2"><div class="f"><label>Vencimento</label><select name="vencTipo" id="vtSel"><option value="util" ${c.vencTipo==='util'?'selected':''}>1º dia útil do mês</option><option value="fixo" ${c.vencTipo==='fixo'?'selected':''}>Dia fixo</option></select></div>
  <div class="f" id="vdBox" style="${c.vencTipo==='fixo'?'':'visibility:hidden'}"><label>Dia que vence</label><input name="vencimento" type="number" min="1" max="31" value="${c.vencimento||1}"></div></div>
  <div class="hint">Novas compras entram na fatura aberta. Quando o banco fechar, use “Fechar fatura” na tela Cartões.</div>
  <div class="mact">${ed?`<button type="button" class="btn danger" id="delC">Excluir</button>`:''}<div class="grow"></div><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div></form>`);
  $('#vtSel').onchange=e=>{$('#vdBox').style.visibility=e.target.value==='fixo'?'visible':'hidden'};
  const fm=$('#fm');
  $('#modal').querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{img=b.dataset.img;$('#modal').querySelectorAll('[data-img],[data-cor]').forEach(x=>x.classList.toggle('on',x===b));if(!fm.nome.value)fm.nome.value=CARD_IMGS[img].t;if(!fm.banco.value)fm.banco.value='Banco do Brasil'});
  $('#modal').querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>{cor=b.dataset.cor;img='';$('#modal').querySelectorAll('[data-img],[data-cor]').forEach(x=>x.classList.toggle('on',x===b))});
  fm.onsubmit=e=>{e.preventDefault();const fd=new FormData(fm);
    const nc={...c,id:c.id||uidGen(),nome:String(fd.get('nome')).trim(),banco:String(fd.get('banco')).trim(),limite:r2(parseNum(fd.get('limite'))),vencimento:Math.min(31,Math.max(1,Number(fd.get('vencimento'))||1)),vencTipo:fd.get('vencTipo'),cor,img,aberta:fd.get('aberta')};
    const L=S.config.cartoes;const i=L.findIndex(x=>x.id===nc.id);if(i>=0)L[i]=nc;else L.push(nc);saveConfig();render();closeModal();toast('Cartão salvo ✓')};
  const dl=$('#delC');if(dl)dl.onclick=()=>{const usos=S.lanc.filter(l=>l.pagamento===c.id).length+S.config.fixas.filter(f=>f.pagamento===c.id).length;confirmDel('este cartão'+(usos?` (${usos} lançamento(s)/conta(s) usam ele e passarão para Débito/Pix)`:''),()=>{
    S.config.cartoes=S.config.cartoes.filter(x=>x.id!==c.id);S.config.fixas.forEach(f=>{if(f.pagamento===c.id)f.pagamento='conta'});saveConfig();
    S.lanc.filter(l=>l.pagamento===c.id).forEach(l=>saveLanc({...l,pagamento:'conta',parcelas:1}));render();toast('Cartão excluído')})};
}
function fecharFatura(id,reabrir){
  const c=cardById(id);const of=openFat(c);
  const txt=reabrir?`Reabrir a fatura de ${MESES[(of-1)%12].toLowerCase()} do ${esc(c.nome)}? Os próximos lançamentos voltam a cair nela.`:`Fechar a fatura de ${MESES[of%12].toLowerCase()} do ${esc(c.nome)} (${fmt(compute(of).cards[c.id]?.total||0)})? Os próximos lançamentos vão para ${MESES[(of+1)%12].toLowerCase()}.`;
  openModal(`<h3>${reabrir?'Reabrir fatura':'Fechar fatura'}</h3><div class="sub" style="font-size:13px">${txt}</div><div class="mact"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="okF">${reabrir?'Reabrir':'Fechar fatura'}</button></div>`);
  $('#okF').onclick=()=>{c.aberta=mkStr(reabrir?of-1:of+1);saveConfig();if(!reabrir&&MK===of)MK=of+1;render();closeModal();toast(reabrir?'Fatura reaberta':'Fatura fechada ✓ — agora lançando em '+MESES[(of+1)%12].toLowerCase())};
}
function addOurocards(){
  const ab=mkStr(TODAY_MK+1);
  [['ouro-infinite','Visa Infinite'],['ouro-platinum','Platinum'],['ouro-nanquim','Elo Nanquim'],['ouro-digital','Digital']].forEach(([img,nome])=>S.config.cartoes.push({id:uidGen(),nome,banco:'Banco do Brasil',limite:0,vencimento:1,vencTipo:'util',cor:'preto',img,aberta:ab}));
  saveConfig();render();toast('4 cartões adicionados ✓');
}

function formRenda(r){
  const ed=!!r;r=r||{nome:'Salário',valor:'',dia:''};
  openModal(`<h3>${ed?'Editar renda':'Nova renda mensal'}</h3><form id="fm">
  <div class="f"><label>Nome</label><input name="nome" required value="${esc(r.nome)}"></div>
  <div class="f2"><div class="f"><label>Valor líquido mensal</label><input name="valor" inputmode="decimal" required placeholder="0,00" value="${numIn(r.valor)}"></div>
  <div class="f"><label>Dia que cai (opcional)</label><input name="dia" type="number" min="1" max="31" value="${r.dia||''}"></div></div>
  <div class="mact">${ed?`<button type="button" class="btn danger" id="delR">Excluir</button>`:''}<div class="grow"></div><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div></form>`);
  $('#fm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const nr={id:r.id||uidGen(),nome:String(fd.get('nome')).trim(),valor:r2(parseNum(fd.get('valor'))),dia:fd.get('dia')?Number(fd.get('dia')):''};
    const L=S.config.rendas;const i=L.findIndex(x=>x.id===nr.id);if(i>=0)L[i]=nr;else L.push(nr);saveConfig();render();closeModal();toast('Renda salva ✓')};
  const dl=$('#delR');if(dl)dl.onclick=()=>confirmDel('esta renda',()=>{S.config.rendas=S.config.rendas.filter(x=>x.id!==r.id);saveConfig();render()});
}

function confirmDel(what,fn){
  openModal(`<h3>Excluir ${esc(what)}?</h3><div class="sub">Essa ação não pode ser desfeita.</div><div class="mact"><button class="btn ghost" data-close>Cancelar</button><button class="btn" style="background:var(--red)" id="okDel">Excluir</button></div>`);
  $('#okDel').onclick=()=>{fn();closeModal()};
}

/* ============ eventos ============ */

function formRendaMes(key){
  key=key&&key!=='1'?key:mkStr(MK);const [y,m]=key.split('-').map(Number);const nomeM=MESES[m-1]+' '+y;
  const C=S.config;C.rendaMes=C.rendaMes||{};const cur=C.rendaMes[key];const pad=C.rendas.reduce((a,r)=>a+Number(r.valor||0),0);
  openModal(`<h3>Renda de ${nomeM}</h3><form id="fm">
  <div class="f"><label>Quanto entrou (ou vai entrar) no mês</label><input name="valor" inputmode="decimal" required placeholder="0,00" value="${numIn(cur)}" style="font-size:22px;font-weight:700"></div>
  <div class="hint">${cur!=null?'Valor informado para este mês.':pad?`Sem valor informado: o app está usando a estimativa padrão de ${fmt(pad)}.`:'Informe o valor líquido que caiu na conta.'} Entradas avulsas (reembolso, 13º, venda) você pode lançar como receita.</div>
  <div class="mact">${cur!=null?'<button type="button" class="btn danger" id="clrR">Usar estimativa</button>':''}<div class="grow"></div><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div></form>`);
  $('#fm').onsubmit=e=>{e.preventDefault();C.rendaMes[key]=r2(parseNum(new FormData(e.target).get('valor')));saveConfig();render();closeModal();toast('Renda de '+nomeM+' salva ✓')};
  const c=$('#clrR');if(c)c.onclick=()=>{delete C.rendaMes[key];saveConfig();render();closeModal();toast('Voltou para a estimativa')};
}

/* ============ eventos ============ */
function doAdd(a,card){({gasto:()=>formLanc(null,'despesa',card),receita:()=>formLanc(null,'receita'),fixa:()=>formFixa(),cartao:()=>formCartao(),renda:()=>formRenda(),rendames:()=>formRendaMes(),importar:()=>formImport(card)})[a]?.()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit],[data-editfixa],[data-editcard],[data-editrenda],a');
  if(!e.target.closest('.rel'))document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));
  if(!t)return;
  if(t.id==='addBtn'){$('#bellMenu').classList.remove('open');$('#addMenu').classList.toggle('open');return}
  if(t.id==='bellBtn'){$('#addMenu').classList.remove('open');$('#bellMenu').classList.toggle('open');return}
  if(t.id==='addMain'){formLanc(null,'despesa');return}
  if(t.dataset.closefat){fecharFatura(t.dataset.closefat);return}
  if(t.dataset.reopen){fecharFatura(t.dataset.reopen,true);return}
  if(t.dataset.gomk){MK=Number(t.dataset.gomk);chipSel=null;render();window.scrollTo(0,0);return}
  if(t.id==='addOuro'){addOurocards();return}
  if(t.dataset.rendames){formRendaMes(t.dataset.rendames);return}
  if(t.dataset.add){document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));doAdd(t.dataset.add,t.dataset.card);return}
  if(t.hasAttribute('data-close')){closeModal();return}
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.chip){const v=Number(t.dataset.chip);chipSel=chipSel===v?null:v;render();return}
  if(t.dataset.mor){morModo=t.dataset.mor;render();return}
  if(t.dataset.pay){const k=mkStr(MK);S.pagas[k]=S.pagas[k]||{};if(S.pagas[k][t.dataset.pay])delete S.pagas[k][t.dataset.pay];else S.pagas[k][t.dataset.pay]=true;savePagas();render();return}
  if(t.dataset.cc){const n=Object.keys(compute(MK).cards).length;cardIdx=Math.max(0,Math.min(n-1,cardIdx+Number(t.dataset.cc)));render();return}
  if(t.dataset.filter){lancFilter=t.dataset.filter;render();return}
  if(t.dataset.t){setTheme(t.dataset.t);return}
  if(t.dataset.edit){const l=S.lanc.find(x=>x.id===t.dataset.edit);if(l)formLanc({...l});return}
  if(t.dataset.editfixa){const f=S.config.fixas.find(x=>x.id===t.dataset.editfixa);if(f)formFixa({...f});return}
  if(t.dataset.editcard){const c=cardById(t.dataset.editcard);if(c)formCartao({...c});return}
  if(t.dataset.editrenda){const r=S.config.rendas.find(x=>x.id===t.dataset.editrenda);if(r)formRenda({...r});return}
  if(t.id==='saveAj'){const R=S.config.reserva=S.config.reserva||{};R.saldo=r2(parseNum($('#resSaldo').value));R.meta=r2(parseNum($('#resMeta').value));R.base=TODAY_MK;S.config.tetoMoradia=Math.min(60,Math.max(1,Number($('#tetoMor').value)||30));S.config.nome=$('#ajNome').value.trim();saveConfig();render();toast('Ajustes salvos ✓');return}
  if(t.id==='impBk'){importBackup($('#bkTxt').value);return}
  if(t.id==='copyBk'){const txt=JSON.stringify({config:S.config,pagas:S.pagas,lancamentos:S.lanc},null,1);navigator.clipboard.writeText(txt).then(()=>toast('Backup copiado'),()=>toast('Não foi possível copiar'));return}
});
document.addEventListener('scroll',e=>{const w=e.target;if(w.id==='ccwrap'){clearTimeout(w._t);w._t=setTimeout(()=>{const kids=[...w.children];let best=0,bd=1e9;kids.forEach((k,i)=>{const dd=Math.abs(k.offsetLeft-w.offsetLeft-w.scrollLeft);if(dd<bd){bd=dd;best=i}});if(best!==cardIdx){cardIdx=best;render()}},160)}},true);
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#prevM').onclick=()=>{MK--;chipSel=null;render()};
$('#nextM').onclick=()=>{MK++;chipSel=null;render()};
$('#monthLbl').onclick=()=>{MK=TODAY_MK;chipSel=null;render()};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('fin-theme',t)}catch(e){}render()}
let th='light';try{th=localStorage.getItem('fin-theme')||'light'}catch(e){}
document.documentElement.dataset.theme=th;
render();
connect();
</script>
</body>
</html>
